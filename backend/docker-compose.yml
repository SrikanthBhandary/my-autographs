version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autograph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # MinIO gives you a local S3-compatible bucket so you don't need a real
  # AWS account during development. Swap for real S3/R2 in production by
  # just changing the S3_* env vars — the app code doesn't change.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - miniodata:/data

  # Mailpit catches all outgoing mail locally so you can see notification
  # emails without needing a real SMTP provider during development. Web UI
  # at http://localhost:8025 — every email sent by the app shows up there.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # RabbitMQ backs the async PDF export pipeline: the API publishes a job
  # here, one or more `go run ./cmd/worker` processes pick it up and build
  # the PDF, then publish a completion notification the API forwards to the
  # browser over WebSocket. Management UI at http://localhost:15672
  # (guest/guest) lets you watch jobs move through the queue.
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI

volumes:
  pgdata:
  miniodata:
